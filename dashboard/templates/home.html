
{% extends "layout.html" %}

{% block main_content %}
<div id="main-content" class="htmleaf-container">
    <div style="padding-left: 93%;">
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal"><i class="fa fa-fw fa-lg fa-plus"></i> Add</button>
    </div>

    <!-- Active / Archived tab navigation -->
    <ul class="nav nav-tabs" id="dash-tabs">
        <li class="active" id="tab-active">
            <a href="#" onclick="switchView('active'); return false;">
                Active <span class="badge" id="badge-active"></span>
            </a>
        </li>
        <li id="tab-archived">
            <a href="#" onclick="switchView('archived'); return false;">
                Archived <span class="badge" id="badge-archived"></span>
            </a>
        </li>
    </ul>

    <!-- Empty state message (hidden by default) -->
    <div id="empty-state" class="empty-state" style="display: none;">
        <i class="fa fa-fw fa-inbox"></i>
        <span id="empty-state-text"></span>
    </div>

    <div class="table-responsive">
        <table id="my" class="table table-hover" data-toggle="table">
            <thead>
                <tr>
                    <th>name<i class="fa fa-fw fa-sm fa-sort"></i></th>
                    <th>author<i class="fa fa-fw fa-sm fa-sort"></i></th>
                    <th>update<i class="fa fa-fw fa-sm fa-sort"></i></th>
                    <th>action</th>
                </tr>
            </thead>
            <tbody id="dash_list">
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block editor_modal %}
<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Editor Modal Header -->
            <div class="modal-header" style="padding: 5px;">
                <h5 class="modal-title" id="myModalLabel">Create dashboard</h5>
            </div>
            <!-- Editor Modal Content -->
            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <label>dashboard name</label>
                        <input class="form-control" id="name">
                    </div>
                    <div class="form-group">
                        <label>author</label>
                        <input class="form-control" id="author">
                    </div>
                    <button id="submit" class="btn btn-default" style="margin-left: 88%;">create</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}

<script type"text/javascript">
    store.set("api_root", "http://" + $("meta[name=api_root]")[0].attributes.value.value + "/");
    api_root = store.get("api_root");
</script>

<script type="text/javascript">
    // Load both lists to populate badge counts, then show active view
    loadDashList('active');
    updateBadgeCounts();
    $(document).ready(function(){
        $(function(){
            $("#my").tablesorter({ sortList: [[2, 1]] });
        });
    });
</script>
{% endblock %}
